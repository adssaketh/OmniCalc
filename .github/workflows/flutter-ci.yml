name: Flutter CI

# The Flutter rewrite lives in flutter_app/. This workflow runs on the flutter-rewrite branch only,
# so the existing "Build Android APK" workflow (main/master, Capacitor) is untouched.
on:
  push:
    branches: [ flutter-rewrite ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generated tables match the web source (theme tokens, SVG paths)
        run: |
          node tools/gen_theme_data.mjs --check
          node tools/gen_svg_paths.mjs --check

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test (golden vectors against the TypeScript oracle)
        run: flutter test --reporter expanded

      # Android scaffolding is generated here (it is not committed yet) and never overwrites existing files.
      # org + project name give the same application id as the web app: com.saketh.omnicalc
      - name: Add Android project if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.saketh --project-name omnicalc .
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: OmniCalc-Flutter-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # Same signing secrets as build-apk.yml. Without them the steps below are skipped.
      - name: Check for signing secrets
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.OMNI_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets not set, skipping the signed release APK."
          fi

      - name: Align and sign release APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.OMNI_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.OMNI_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.OMNI_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.OMNI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/omnicalc-release.jks"
          echo "$KEYSTORE_B64" | base64 -d > "$KS"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$KS" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$GITHUB_WORKSPACE/OmniCalc-flutter-release-signed.apk" \
            "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs "$GITHUB_WORKSPACE/OmniCalc-flutter-release-signed.apk"
          rm -f "$KS"

      - name: Upload signed release APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OmniCalc-Flutter-Release-Signed-APK
          path: OmniCalc-flutter-release-signed.apk
          if-no-files-found: error
          retention-days: 90

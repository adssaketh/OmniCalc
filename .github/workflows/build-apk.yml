name: Build Android APK

# OmniCalc lives in flutter_app/. Every push to main builds, tests and (with the signing secrets) signs the APK.
# Pushing a version tag such as 1.2.0 also publishes a GitHub Release with the signed APK attached. The tag must
# match the version in flutter_app/pubspec.yaml.
on:
  push:
    branches: [ main, master ]
    tags: [ '[0-9]+.[0-9]+.[0-9]+' ]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub Release on a tag push

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)"
          echo "pubspec version: $VERSION, tag: $GITHUB_REF_NAME"
          test "$VERSION" = "$GITHUB_REF_NAME"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up toolchain (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Toolchain version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generated tables match the original source (theme tokens, SVG paths)
        run: |
          node tools/gen_theme_data.mjs --check
          node tools/gen_svg_paths.mjs --check

      - name: Lucide icons match lucide-react 0.546 (the original app's version)
        run: |
          mkdir -p "$RUNNER_TEMP/lucide"
          (cd "$RUNNER_TEMP/lucide" && npm init -y >/dev/null && npm install lucide-react@0.546.0 --no-audit --no-fund)
          LUCIDE_DIR="$RUNNER_TEMP/lucide/node_modules/lucide-react" node tools/gen_lucide_paths.mjs --check

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test (golden vectors against the TypeScript oracle)
        run: flutter test --reporter expanded

      # Android scaffolding is generated here (it is not committed yet) and never overwrites existing files.
      # org + project name give the application id com.saketh.omnicalc, the same as every earlier OmniCalc build.
      - name: Add Android project if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.saketh --project-name omnicalc .
          fi

      # The generated project has the default Flutter icon and label; replace them with OmniCalc's own.
      - name: Apply OmniCalc launcher icon and name
        run: |
          dart pub global activate flutter_launcher_icons 0.14.3
          dart pub global run flutter_launcher_icons
          sed -i 's|android:label="[^"]*"|android:label="OmniCalc"|' android/app/src/main/AndroidManifest.xml

      # `flutter create` only puts INTERNET in the debug and profile manifests. Without it a release APK cannot reach the
      # network at all, so live exchange rates always fell back to the built-in ones.
      - name: Allow network access and opening links
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$M" || sed -i '0,/<application/s|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <application|' "$M"
          # the generated manifest already has a <queries> block; add the https VIEW intent to it (links in Settings > About)
          grep -q 'android:scheme="https"' "$M" || sed -i 's|</queries>|    <intent>\n            <action android:name="android.intent.action.VIEW"/>\n            <data android:scheme="https"/>\n        </intent>\n    </queries>|' "$M"
          cat "$M"
          grep -q 'android.permission.INTERNET' "$M"
          grep -n 'android:label\|android:icon' android/app/src/main/AndroidManifest.xml
          ls android/app/src/main/res/mipmap-xxxhdpi/ android/app/src/main/res/mipmap-anydpi-v26/ 2>/dev/null || true

      # Each build gets a higher versionCode (the run number of this workflow, as in earlier releases), so a newer APK
      # can always be installed over an older one signed with the same key. The pubspec build number (+N) is not used.
      # The Gradle distribution is downloaded from GitHub on the first run and that download sometimes answers 504, so
      # a failed build is tried again (up to three times) before the job fails.
      - name: Build release APK
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --release --build-number=${{ github.run_number }}; then exit 0; fi
            echo "::warning::Build attempt $attempt failed"
            sleep 45
          done
          exit 1

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: OmniCalc-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # Signing needs these four repository secrets. Without them the steps below are skipped.
      - name: Check for signing secrets
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.OMNI_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets not set, skipping the signed release APK."
          fi
          if [ "$(grep -c . <<<"$KEYSTORE_B64")" -gt 0 ]; then
            echo "### APK: signed release built (secrets present)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### APK: UNSIGNED only (OMNI_KEYSTORE_B64 not set)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Align and sign release APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.OMNI_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.OMNI_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.OMNI_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.OMNI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/omnicalc-release.jks"
          echo "$KEYSTORE_B64" | base64 -d > "$KS"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$KS" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$GITHUB_WORKSPACE/OmniCalc-release-signed.apk" \
            "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs "$GITHUB_WORKSPACE/OmniCalc-release-signed.apk"
          rm -f "$KS"

      - name: Upload signed release APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OmniCalc-Release-Signed-APK
          path: OmniCalc-release-signed.apk
          if-no-files-found: error
          retention-days: 90

  screenshots:
    # Regression screenshots rendered by this app. Pinned toolchain so pixels stay stable; see flutter_app/PHASE8C_NOTES.md.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get
      - name: Compare screenshots
        run: OMNI_SCREENSHOTS=1 flutter test test/screenshots --reporter expanded
      - name: Keep failure images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-failures
          path: flutter_app/test/screenshots/failures/
          if-no-files-found: ignore
          retention-days: 14

  # Pushing a version tag such as 1.2.0 publishes a GitHub Release with the signed APK attached, once the build
  # (analysis, tests, signing) and the screenshot check have both passed.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, screenshots]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: OmniCalc-Release-Signed-APK
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cp dist/OmniCalc-release-signed.apk "OmniCalc-${TAG}.apk"
          gh release create "$TAG" "OmniCalc-${TAG}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "OmniCalc ${TAG}" \
            --notes-file RELEASE_NOTES.md \
            || gh release upload "$TAG" "OmniCalc-${TAG}.apk" --repo "$GITHUB_REPOSITORY" --clobber

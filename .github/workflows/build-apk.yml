name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ '[0-9]+.[0-9]+.[0-9]+' ]   # e.g. 1.1.0 publishes a GitHub Release
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub Release on a tag push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Web App
        run: npm run build

      - name: Add Android project if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate Android icons
        run: npx @capacitor/assets generate --android

      - name: Apply Android customisations
        run: node scripts/patch-android.mjs

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      # Each build gets a higher versionCode (the run number), so a newer APK can always be installed
      # over an older one signed with the same key.
      - name: Set versionCode from run number
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n "versionCode" android/app/build.gradle

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OmniCalc-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------------------------------------------
      # Signed release APK. Needs these four repository secrets (Settings > Secrets and variables >
      # Actions); without them the steps below are skipped and the debug APK is still built.
      #   OMNI_KEYSTORE_B64       the keystore file, base64 encoded
      #   OMNI_KEY_ALIAS          key alias inside the keystore
      #   OMNI_KEYSTORE_PASSWORD  keystore password
      #   OMNI_KEY_PASSWORD       key password (same as the keystore password for a PKCS12 keystore)
      # ---------------------------------------------------------------------------------------------
      - name: Check for signing secrets
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.OMNI_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets not set, skipping the signed release APK."
          fi

      - name: Build Release APK (unsigned)
        if: steps.signing.outputs.enabled == 'true'
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Align and sign Release APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.OMNI_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.OMNI_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.OMNI_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.OMNI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/omnicalc-release.jks"
          echo "$KEYSTORE_B64" | base64 -d > "$KS"

          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "Using build-tools: $BT"
          UNSIGNED="$(ls android/app/build/outputs/apk/release/*.apk | head -1)"
          echo "Unsigned APK: $UNSIGNED"

          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$KS" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out OmniCalc-release-signed.apk \
            "$RUNNER_TEMP/aligned.apk"

          # Prints the signing certificate (SHA-256): keep a copy, store listings may ask for it
          "$BT/apksigner" verify --verbose --print-certs OmniCalc-release-signed.apk
          rm -f "$KS"

      - name: Upload signed Release APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OmniCalc-Release-Signed-APK
          path: OmniCalc-release-signed.apk
          if-no-files-found: error
          retention-days: 90

      # Pushing a version tag such as 1.1.0 publishes a GitHub Release with the signed APK attached
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && steps.signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cp OmniCalc-release-signed.apk "OmniCalc-${TAG}.apk"
          gh release create "$TAG" "OmniCalc-${TAG}.apk" \
            --title "OmniCalc ${TAG}" \
            --notes-file RELEASE_NOTES.md \
            || gh release upload "$TAG" "OmniCalc-${TAG}.apk" --clobber

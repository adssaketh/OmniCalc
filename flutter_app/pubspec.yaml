name: omnicalc
description: OmniCalc rewritten in Flutter (Android first). The TypeScript engine in ../src is the oracle.
publish_to: 'none'
version: 1.2.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

# Packages are added in the phase that first uses them, so nothing unused can break dependency resolution.
# Phase 2: http + shared_preferences (currency rates fetch and cache).
# Phase 3: provider (state), dynamic_color (Material You palette plugin; read over its method channel).
# Phase 5f: url_launcher (Settings > About opens the source code and privacy links in the browser, as the web app's links do).
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  provider: ^6.1.2
  dynamic_color: ^1.8.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

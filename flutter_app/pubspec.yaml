name: omnicalc
description: OmniCalc rewritten in Flutter (Android first). The TypeScript engine in ../src is the oracle.
publish_to: 'none'
version: 1.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

# Phase 1 only needs Flutter itself. Packages (provider, shared_preferences, http, dynamic_color, ...)
# are added in the phase that first uses them, so nothing unused can break dependency resolution.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
